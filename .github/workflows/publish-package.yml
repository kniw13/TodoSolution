name: Publish package to GitHub Packages

on:
  workflow_run:
    workflows: ["CI / Build & Test"]
    types:
      - completed

jobs:
  publish:
    # Публикуем ТОЛЬКО если CI завершился успешно И это был пуш в master (а не PR)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Скачиваем именно тот коммит, который собрался
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # dotnet-quality: 'preview' # Раскомментируйте, если 10-ка еще не вышла официально

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # --- ОТЛАДКА (можно удалить потом) ---
      - name: Verify Project Exists
        run: |
          ls -la
          ls -la Todo.Core/
      # -------------------------------------

      - name: Pack
        # ИСПОЛЬЗУЕМ ПУТЬ К ПАПКЕ (dotnet сам найдет .csproj внутри) 
        # или проверьте точное имя файла
        run: dotnet pack Todo.Core/Todo.Core.csproj -c Release -o ./artifacts

      - name: Push package to GitHub Packages (NuGet)
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate